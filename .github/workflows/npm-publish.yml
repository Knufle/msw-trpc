name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag to publish (for example v3.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$PRERELEASE" == "true" ]]; then
            echo "::error::Only stable vX.Y.Z release tags can publish."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify package version matches release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { version } = JSON.parse(readFileSync('packages/msw-trpc/package.json'));
            if (process.env.RELEASE_TAG !== 'v' + version) {
              throw new Error('Release tag must match package version ' + version);
            }
          "
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @knufle/msw-trpc build
      - run: node scripts/check-package.mjs
      - name: Publish with npm trusted publishing
        working-directory: packages/msw-trpc
        run: npm publish --access public --provenance
